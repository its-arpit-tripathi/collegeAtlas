<!DOCTYPE html>
<html class="dark scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CollegeAtlas | Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#050608",
                        "surface": "#111318",
                        "accent-cyan": "#00F0FF",
                        "on-surface": "#e2e2e8",
                        "text-primary": "#FFFFFF",
                        "text-secondary": "#94A3B8"
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .glow-button {
            background: linear-gradient(135deg, #7000ff 0%, #00F0FF 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-size: 200% auto;
        }
        .glow-button:hover {
            background-position: right center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transform: scale(1.02);
        }
        .input-glow:focus {
            border-color: #00F0FF !important;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }

        /* Canvas particles */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }
        /* Animated Background */
        .animated-bg {
            background: linear-gradient(135deg, #050608 0%, #0e1017 50%, #050608 100%);
            background-size: 400% 400%;
            animation: bg-shift 15s infinite ease-in-out;
        }
        @keyframes bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Custom Toast */
        .custom-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1c20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 16px 28px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-weight: 500;
            font-size: 0.95rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10000;
            pointer-events: none;
        }
        .custom-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .custom-toast.success {
            border-left: 4px solid #00F0FF;
        }
        .custom-toast.error {
            border-left: 4px solid #DC3545;
        }

        /* Custom Scrollbar Styles */
        /* For Webkit-based browsers (Chrome, Edge, Safari) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050608;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00F0FF;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* Specific scrollbar styling */
        div::-webkit-scrollbar {
            width: 6px;
        }
        div::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2);
        }
        div::-webkit-scrollbar-thumb:hover {
            background: #00F0FF;
        }

        /* For Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 240, 255, 0.25) #050608;
        }

        /* Smooth Scrolling */
        html,
        div {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="animated-bg text-on-surface font-body-md overflow-x-hidden min-h-screen flex items-center justify-center relative">
<canvas id="particle-canvas"></canvas>


<!-- Background circular layout image -->
<div class="absolute right-[-100px] top-[10%] w-[550px] h-[550px] rounded-full overflow-hidden pointer-events-none opacity-20 hidden lg:block border border-purple-500/20">
    <div class="absolute inset-0 bg-gradient-to-r from-background via-purple-900/40 to-transparent z-10"></div>
    <img src="images/bg-img-collegefinder.png" class="w-full h-full object-cover grayscale brightness-50 contrast-125" alt="Skyline crop">
</div>

<!-- Login Card -->
<div class="glass-card w-full max-w-[460px] rounded-2xl p-10 mx-4 z-10 text-center relative">
    <a href="index.html" class="inline-block font-headline-md text-headline-md font-bold text-accent-cyan tracking-tight mb-6">CollegeAtlas</a>
    <h2 class="text-white text-2xl font-bold font-headline-lg mb-2">Welcome Back</h2>
    <p class="text-text-secondary text-sm mb-8">Continue your journey to find the perfect college.</p>

    <form id="login-form" class="space-y-6">
        <div class="space-y-2 text-left">
            <label class="font-label-bold text-text-secondary uppercase text-[10px] tracking-widest font-semibold">Email Address</label>
            <input class="w-full bg-[#050608]/40 border border-white/15 focus:border-accent-cyan rounded-lg p-3 text-white transition-all text-sm outline-none input-glow" placeholder="name@university.edu" type="email" required/>
        </div>
        <div class="space-y-2 text-left">
            <label class="font-label-bold text-text-secondary uppercase text-[10px] tracking-widest font-semibold">Password</label>
            <div class="relative">
                <input id="password-field" class="w-full bg-[#050608]/40 border border-white/15 focus:border-accent-cyan rounded-lg p-3 pr-10 text-white transition-all text-sm outline-none input-glow" placeholder="••••••••" type="password" required/>
                <button type="button" id="toggle-password-btn" aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-secondary hover:text-accent-cyan transition-colors flex items-center justify-center p-1 focus:outline-none">
                    <span class="material-symbols-outlined text-[18px]" id="password-toggle-icon">visibility</span>
                </button>
            </div>
        </div>

        <div class="flex justify-between items-center text-xs">
            <label class="flex items-center gap-2 cursor-pointer group text-text-secondary">
                <input class="rounded bg-[#050608] border-white/15 text-accent-cyan focus:ring-accent-cyan" type="checkbox"/>
                <span class="group-hover:text-white transition-colors">Remember me</span>
            </label>
            <a href="#" class="text-accent-cyan hover:underline">Forgot Password?</a>
        </div>

        <button class="glow-button w-full py-3.5 rounded-lg font-bold text-white uppercase tracking-wider text-sm mt-4 shadow-xl flex items-center justify-center gap-2" type="submit">
            Login <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
        </button>
    </form>

    <p class="text-xs text-text-secondary mt-8">Don't have an account? <a href="signup.html" class="text-accent-cyan font-semibold hover:underline">Sign Up</a></p>
</div>

<div id="toast"></div>

<!-- Logic handler script -->
<script>
    // Base API URL config:
    // - In production (e.g. Vercel), use relative URLs ("")
    // - In local dev when served directly by backend on port 8000, use relative URLs ("")
    // - In local dev when served by a static dev server (e.g. port 3000, 5500, etc.), point to backend at port 8000
    const isLocal = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
    const isBackendHost = isLocal && window.location.port === "8000";
    const API_BASE = (!isLocal || isBackendHost) ? "" : `http://${window.location.hostname}:8000`;

    function getAuthHeaders() {
        const token = localStorage.getItem("authToken");
        return token ? { "Authorization": `Bearer ${token}` } : {};
    }

    // Redirect to dashboard if already logged in
    (async () => {
        try {
            const res = await fetch(`${API_BASE}/auth`, { 
                credentials: "include",
                headers: getAuthHeaders()
            });
            const data = await res.json();
            if (res.ok && data.success) {
                window.location.href = "index.html";
            }
        } catch (err) {
            console.log("Not logged in");
        }
    })();

    // Password view toggle
    const togglePasswordBtn = document.querySelector("#toggle-password-btn");
    const passwordField = document.querySelector("#password-field");
    const passwordToggleIcon = document.querySelector("#password-toggle-icon");

    if (togglePasswordBtn && passwordField && passwordToggleIcon) {
        togglePasswordBtn.addEventListener("click", () => {
            const isPassword = passwordField.type === "password";
            passwordField.type = isPassword ? "text" : "password";
            passwordToggleIcon.textContent = isPassword ? "visibility_off" : "visibility";
            togglePasswordBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
        });
    }

    // Form submission
    const form = document.querySelector("#login-form");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const emailInput = form.querySelector('input[type="email"]');
        const passwordInput = form.querySelector('#password-field') || form.querySelector('input[type="password"]');

        try {
            const response = await fetch(`${API_BASE}/signin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    email: emailInput.value,
                    password: passwordInput.value
                })
            });
            
            const data = await response.json();
            if (response.ok && data.success) {
                if (data.token) {
                    localStorage.setItem("authToken", data.token);
                }
                showToast("Login successful! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
            } else {
                showToast(data.message || data.error || "Login failed", "error");
            }
        } catch (err) {
            console.error("Login connection error:", err);
            showToast("Server connection error. Please try again.", "error");
        }
    });

    // Toast Utility
    function showToast(message, type = "success") {
        const toast = document.createElement("div");
        toast.classList.add("custom-toast", type);
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add("show"), 100);
        setTimeout(() => {
            toast.classList.remove("show");
            setTimeout(() => {
                if (document.body.contains(toast)) document.body.removeChild(toast);
            }, 400);
        }, 3000);
    }



    // Canvas Particles
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(0, 240, 255, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 40; i++) particles.push(new Particle());
    }
    initParticles();

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();
</script>
</body>
</html>
